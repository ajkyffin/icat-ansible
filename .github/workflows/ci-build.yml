name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  run_all_roles:
    runs-on: ubuntu-20.04
    steps:

    - name: Check ports
      run: sudo netstat -lnp

    - name: Check mysql service
      run: sudo systemctl status mysql

    - name: Check /var/lib/mysql
      run: sudo ls -lh /var/lib/mysql/

    - name: Check Apparmor
      run: sudo ls -lh /etc/apparmor.d/
