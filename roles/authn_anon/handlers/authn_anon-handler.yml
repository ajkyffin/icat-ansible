---

- name: "Re-install authn_anon"
  shell: 'su -l {{ payara_user }} -c "cd /home/{{ payara_user }}/install/authn.anon; ./setup -vv install"'
  become: true
  become_user: root
  args:
    executable: /bin/bash

- name: "Re-Collect Payara info"
  payara_info:
    asadmin: "{{ payara_dir }}/bin/asadmin"
  become: true
  become_user: "{{ payara_user }}"
  register: payara_info
